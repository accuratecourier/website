<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            padding: 40px 20px;
            max-width: 600px;
        }

        h1 {
            font-size: 52px;
            margin-bottom: 20px;
        }

        p {
            font-size: 20px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .coming-soon {
            font-size: 16px;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0.8;
            margin-bottom: 15px;
        }

        .contact {
            display: inline-block;
            padding: 12px 25px;
            background: white;
            color: #1e3c72;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
        }

        .contact:hover {
            background: #f0f0f0;
        }

        footer {
            margin-top: 50px;
            font-size: 13px;
            opacity: 0.7;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="coming-soon">Coming Soon</div>

        <h1>Something Amazing Is Coming</h1>

        <p>
            We are working hard to bring you our new website.
            Please check back soon!
        </p>

        <a href="mailto:info@example.com" class="contact">
            Contact Us
        </a>

        <footer>
            &copy; 2026 Your Company Name. All Rights Reserved.
        </footer>

    </div>

</body>
</html>
